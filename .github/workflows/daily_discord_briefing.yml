name: Daily Discord Briefing

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC daily
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to render (YYYY-MM-DD, defaults to today)'
        required: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout knowledge repo (facts only)
        uses: actions/checkout@v4
        with:
          repository: elizaOS/knowledge
          path: knowledge
          sparse-checkout: |
            the-council/facts/
            the-council/council_briefing/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install discord.py requests python-dotenv

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm ci

      - name: Install Chrome for Remotion
        working-directory: remotion
        run: npx remotion browser ensure

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Find latest facts
        id: facts
        run: |
          DATE="${{ steps.date.outputs.date }}"
          FACTS_FILE="knowledge/the-council/facts/${DATE}.json"
          if [ ! -f "$FACTS_FILE" ]; then
            FACTS_FILE=$(ls -t knowledge/the-council/facts/????-??-??.json 2>/dev/null | head -1)
          fi
          if [ -z "$FACTS_FILE" ]; then
            echo "No facts files found. Skipping."
            exit 0
          fi
          echo "file=$FACTS_FILE" >> $GITHUB_OUTPUT
          echo "Using facts: $FACTS_FILE"

      - name: Send text briefing
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/discord_webhook.py "${{ steps.facts.outputs.file }}"

      - name: Generate Remotion props
        run: |
          python scripts/generate_daily_card.py "${{ steps.facts.outputs.file }}" \
            --out /tmp/daily-card-props.json

      - name: Render DailyCard video
        working-directory: remotion
        run: |
          npx remotion render DailyCard \
            --props /tmp/daily-card-props.json \
            --crf 28 \
            /tmp/daily-card.mp4

      - name: Post video to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          python scripts/discord_webhook.py --simple \
            --image /tmp/daily-card.mp4 \
            --url "https://elizaos.news/daily/${DATE}" \
            --title "ElizaOS Daily — ${DATE}"
