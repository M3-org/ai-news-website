name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout knowledge repo
        uses: actions/checkout@v4
        with:
          repository: elizaOS/knowledge
          path: knowledge
          sparse-checkout: |
            api/
            the-council/facts/
            the-council/council_briefing/
            the-council/highlights/
            ai-news/elizaos/json/
            github/stats/day/
            daily-silk/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Copy static assets to dist
        run: |
          cp -r unity/ dist/unity/ 2>/dev/null || true
          cp -r media/daily/ dist/media/daily/ 2>/dev/null || true
          cp -r rss/ dist/rss/ 2>/dev/null || true
          cp -r scripts/posters/characters/ dist/scripts/posters/characters/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
