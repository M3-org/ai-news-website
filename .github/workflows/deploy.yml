name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 12 * * *'   # Daily 12:30 UTC — after knowledge pipeline + poster gen
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout knowledge repo
        uses: actions/checkout@v7
        with:
          repository: elizaOS/knowledge
          path: knowledge
          sparse-checkout: |
            api/
            the-council/facts/
            the-council/council_briefing/
            the-council/highlights/
            ai-news/elizaos/json/
            github/stats/day/
            github/api/summaries/overall/day/
            daily-silk/

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Copy static assets to dist
        run: |
          mkdir -p dist/media dist/scripts/posters
          cp -r unity/ dist/unity/ 2>/dev/null || true
          cp -r media/daily dist/media/daily 2>/dev/null || true
          cp -r media/dashboards dist/media/dashboards 2>/dev/null || true
          cp -r rss/ dist/rss/ 2>/dev/null || true
          cp -r scripts/posters/characters/ dist/scripts/posters/characters/ 2>/dev/null || true
          mkdir -p dist/api/data
          cp knowledge/api/manifest.json dist/api/data/manifest.json 2>/dev/null || true
          cp knowledge/api/latest.json dist/api/data/latest.json 2>/dev/null || true
          echo "Static assets copied:"
          ls dist/media/daily/ 2>/dev/null | head -10 || echo "  No media/daily"
          ls dist/media/daily/2026-02-16/ 2>/dev/null | head -5 || echo "  No 2026-02-16 images"
          ls dist/unity/ 2>/dev/null | head -5 || echo "  No unity"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
