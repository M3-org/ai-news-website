name: Generate Illustrations (Manual)

on:
  workflow_dispatch:
    inputs:
      facts_date:
        description: 'Facts file date (YYYY-MM-DD) or "today" for latest'
        required: false
        default: 'today'
      with_icons:
        description: 'Include icon sheet'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      upload_to_cdn:
        description: 'Upload to Bunny CDN'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      dry_run:
        description: 'Dry run (no generation or upload)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: ai-news-poster-generation
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/scripts/posters

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout ai-news-website
        uses: actions/checkout@v7

      - name: Checkout knowledge data
        uses: actions/checkout@v7
        with:
          repository: elizaOS/knowledge
          path: knowledge
          sparse-checkout: |
            the-council/facts
            the-council/council_briefing
            the-council/retros
            the-council/aggregated
            hackmd/facts
            ai-news/elizaos/json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Determine facts file
        id: facts
        run: |
          KNOWLEDGE_DIR="${{ github.workspace }}/knowledge"

          if [ "${{ inputs.facts_date }}" = "today" ]; then
            FACTS_FILE=$(ls -t "${KNOWLEDGE_DIR}/the-council/facts/"????-??-??.json 2>/dev/null | head -1)
            if [ -z "$FACTS_FILE" ]; then
              echo "::error::No facts files found in knowledge repo"
              exit 1
            fi
          else
            FACTS_FILE="${KNOWLEDGE_DIR}/the-council/facts/${{ inputs.facts_date }}.json"
          fi

          if [ ! -f "$FACTS_FILE" ]; then
            echo "::error::Facts file not found: $FACTS_FILE"
            exit 1
          fi

          FACTS_DATE=$(python3 -c "import json; print(json.load(open('${FACTS_FILE}'))['briefing_date'])")
          OUTPUT_DIR_REL="media/daily/${FACTS_DATE}"

          echo "facts_file=${FACTS_FILE}" >> "$GITHUB_OUTPUT"
          echo "facts_date=${FACTS_DATE}" >> "$GITHUB_OUTPUT"
          echo "output_dir_rel=${OUTPUT_DIR_REL}" >> "$GITHUB_OUTPUT"

          echo "Facts file: ${FACTS_FILE}"
          echo "Facts date: ${FACTS_DATE}"
          echo "Output dir: ${OUTPUT_DIR_REL}"

      - name: Generate illustrations
        id: generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        working-directory: ${{ github.workspace }}/scripts/posters
        run: |
          FLAGS=""
          [ "${{ inputs.with_icons }}" = "true" ] && FLAGS="$FLAGS --with-icons"
          [ "${{ inputs.dry_run }}" = "true" ] && FLAGS="$FLAGS --dry-run"

          echo "Running: python illustrate.py -f ${{ steps.facts.outputs.facts_file }} --batch $FLAGS"
          python illustrate.py -f "${{ steps.facts.outputs.facts_file }}" --batch $FLAGS

          OUTPUT_DIR="${{ github.workspace }}/${{ steps.facts.outputs.output_dir_rel }}"
          if [ -d "$OUTPUT_DIR" ]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
            ls -la "$OUTPUT_DIR/"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Output directory not created"
          fi

      - name: Upload to CDN
        if: inputs.upload_to_cdn == 'true' && inputs.dry_run == 'false' && steps.generate.outputs.generated == 'true'
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_CDN_URL: ${{ secrets.BUNNY_CDN_URL }}
        run: |
          python scripts/cdn_upload.py \
            "${{ steps.facts.outputs.output_dir_rel }}" \
            --update-manifest \
            -v

      - name: Commit changes
        if: inputs.dry_run == 'false' && steps.generate.outputs.generated == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Generate illustrations for ${{ steps.facts.outputs.facts_date }}"
          file_pattern: "${{ steps.facts.outputs.output_dir_rel }}/ rss/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      - name: Summary
        run: |
          echo "## Illustration Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Facts file | \`${{ steps.facts.outputs.facts_date }}.json\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Output | \`${{ steps.facts.outputs.output_dir_rel }}/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| With icons | ${{ inputs.with_icons }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CDN upload | ${{ inputs.upload_to_cdn }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry run | ${{ inputs.dry_run }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Generated | ${{ steps.generate.outputs.generated }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.upload_to_cdn }}" = "true" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### CDN URLs" >> $GITHUB_STEP_SUMMARY
            echo "Base: \`https://cdn.elizaos.news/${{ steps.facts.outputs.output_dir_rel }}/\`" >> $GITHUB_STEP_SUMMARY
          fi
