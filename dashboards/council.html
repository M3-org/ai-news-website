<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElizaOS Council Briefing</title>
  <link rel="stylesheet" href="lib/design-tokens.css">
  <link rel="stylesheet" href="council_briefing.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="lib/data-loader.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="title-group">
          <h1>Council Briefing</h1>
          <div class="subtitle">Strategic Deliberation</div>
        </div>
        <div class="date-nav">
          <button class="nav-btn" id="prev-btn" title="Previous day (←)">←</button>
          <input type="date" class="date-input" id="date-picker" title="Select date">
          <button class="nav-btn" id="next-btn" title="Next day (→)">→</button>
        </div>
      </div>
    </div>

    <!-- Meeting Context (collapsible) -->
    <div class="meeting-context" id="meeting-context-section">
      <div class="context-header" id="context-toggle">
        <div class="context-title">
          <span class="expand-icon">▶</span>
          <span>North Star & Strategic Context</span>
        </div>
      </div>
      <div class="context-content" id="context-content">
        <div class="context-body" id="context-body"></div>
      </div>
    </div>

    <!-- Daily Focus -->
    <div id="daily-focus-container"></div>

    <!-- Deliberation Questions -->
    <div class="deliberation-section">
      <h2 class="section-title">Key Deliberations</h2>
      <div id="deliberations-container"></div>
    </div>
  </div>

  <script>
    let currentDate = null;

    // Initialize
    async function init() {
      const manifest = await ElizaData.init();
      currentDate = manifest.latest.council_briefing;

      // Set up date picker
      const picker = document.getElementById('date-picker');
      picker.value = currentDate;
      picker.max = currentDate; // Can't go beyond latest available

      // Load initial briefing
      await loadBriefing(currentDate);

      // Set up event listeners
      setupEventListeners();
    }

    function setupEventListeners() {
      const picker = document.getElementById('date-picker');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const contextToggle = document.getElementById('context-toggle');

      // Date picker change
      picker.addEventListener('change', async (e) => {
        currentDate = e.target.value;
        await loadBriefing(currentDate);
      });

      // Navigation buttons
      prevBtn.addEventListener('click', () => navigateDate(-1));
      nextBtn.addEventListener('click', () => navigateDate(1));

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return; // Don't interfere with input fields

        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          navigateDate(-1);
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          navigateDate(1);
        }
      });

      // Context toggle
      contextToggle.addEventListener('click', () => {
        const header = document.getElementById('context-toggle');
        const content = document.getElementById('context-content');

        header.classList.toggle('expanded');
        content.classList.toggle('expanded');
      });
    }

    async function navigateDate(days) {
      const date = new Date(currentDate);
      date.setDate(date.getDate() + days);

      const newDate = date.toISOString().split('T')[0];
      const picker = document.getElementById('date-picker');

      // Don't go beyond max date
      if (newDate > picker.max) return;

      currentDate = newDate;
      picker.value = newDate;

      await loadBriefing(currentDate);
    }

    async function loadBriefing(date) {
      try {
        // Load council briefing data for specific date
        const briefing = await ElizaData._fetch(`/the-council/council_briefing/${date}.json`);

        // Update navigation buttons
        updateNavButtons();

        // Render meeting context
        renderMeetingContext(briefing.meeting_context);

        // Render daily focus
        renderDailyFocus(briefing.daily_focus, briefing.monthly_goal);

        // Render deliberations
        renderDeliberations(briefing.key_points);

      } catch (error) {
        console.error('Failed to load briefing:', error);
        document.getElementById('daily-focus-container').innerHTML = `
          <div class="error">
            <p><strong>Failed to load council briefing for ${date}</strong></p>
            <p style="margin-top: 0.5rem; font-size: 0.875rem;">${ElizaData.escapeHtml(error.message)}</p>
          </div>
        `;
      }
    }

    function updateNavButtons() {
      const picker = document.getElementById('date-picker');
      const nextBtn = document.getElementById('next-btn');

      // Disable next button if at latest date
      nextBtn.disabled = currentDate >= picker.max;
    }

    function renderMeetingContext(contextMarkdown) {
      const container = document.getElementById('context-body');

      // Simple markdown-to-HTML conversion
      const html = contextMarkdown
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/^\*\*(.+?)\*\*:?/gm, '<strong>$1</strong>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
        .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/^(?!<[h|u|l])/gm, '<p>')
        .replace(/$/gm, '</p>')
        .replace(/<\/p><p><\/p>/g, '')
        .replace(/<p><h/g, '<h')
        .replace(/<\/h[1-3]><\/p>/g, '</h3>')
        .replace(/<p><ul>/g, '<ul>')
        .replace(/<\/ul><\/p>/g, '</ul>');

      container.innerHTML = html;
    }

    function renderDailyFocus(focus, monthlyGoal) {
      const container = document.getElementById('daily-focus-container');
      container.innerHTML = `
        <div class="daily-focus">
          <div class="focus-header" id="focus-toggle" onclick="toggleFocus()">
            <div class="focus-label">
              <span class="expand-icon">▶</span>
              Daily Strategic Focus
            </div>
          </div>
          <div class="focus-text">${ElizaData.escapeHtml(focus)}</div>
          <div class="focus-content" id="focus-content">
            <div class="monthly-goal">
              <div class="monthly-label">Monthly Goal</div>
              <div class="monthly-text">${ElizaData.escapeHtml(monthlyGoal)}</div>
            </div>
          </div>
        </div>
      `;
    }

    function toggleFocus() {
      const header = document.getElementById('focus-toggle');
      const content = document.getElementById('focus-content');
      header.classList.toggle('expanded');
      content.classList.toggle('expanded');
    }

    function renderDeliberations(keyPoints) {
      const container = document.getElementById('deliberations-container');

      const html = keyPoints.map((point, pointIndex) => {
        const deliberationsHtml = point.deliberation_items.map(item => `
          <div class="deliberation-card">
            <div class="deliberation-header">
              <div class="question-id">${item.question_id.toUpperCase()}</div>
              <div class="question-text">${ElizaData.escapeHtml(item.text)}</div>
            </div>

            ${item.context && item.context.length > 0 ? `
              <ul class="context-list">
                ${item.context.map(ctx => `
                  <li>${ElizaData.escapeHtml(ctx)}</li>
                `).join('')}
              </ul>
            ` : ''}

            <div class="answers-grid">
              ${Object.entries(item.multiple_choice_answers).map(([key, answer], index) => `
                <div class="answer-option">
                  <div class="answer-label">
                    <span class="answer-number">${index + 1}</span>
                    <span class="answer-text">${ElizaData.escapeHtml(answer.text)}</span>
                  </div>
                  ${answer.implication ? `
                    <div class="answer-implication">
                      ${ElizaData.escapeHtml(answer.implication)}
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        `).join('');

        return `
          <div class="key-point-wrapper">
            <div class="key-point-header">
              <div class="topic-badge">${ElizaData.escapeHtml(point.topic)}</div>
              <div class="summary-text">${ElizaData.escapeHtml(point.summary)}</div>
            </div>
            ${deliberationsHtml}
          </div>
        `;
      }).join('');

      container.innerHTML = html;
    }

    // Load on page load
    init();
  </script>
</body>
</html>
